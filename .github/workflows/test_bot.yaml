name: Test Bot

# Manual only. Forecasts on Metaculus's bot-testing-area tournament (practice
# questions; scores there do not count). Costs real LLM money, roughly the same
# per question as a tournament question, and is counted in the spend ledger.

on:
  workflow_dispatch:

concurrency:
  group: metaculus-bot-spend
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-dev-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Unit tests and offline dry run (no keys used)
        run: |
          poetry run pytest -q
          poetry run python main.py --mode dry_run
      - name: Run bot on the bot-testing-area
        timeout-minutes: 45
        run: |
          poetry run python main.py --mode test_questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          MAX_USD_PER_QUESTION: ${{ vars.MAX_USD_PER_QUESTION }}
          FULL_ENSEMBLE: ${{ vars.FULL_ENSEMBLE }}
          ECONOMY_ENSEMBLE: ${{ vars.ECONOMY_ENSEMBLE }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          PACE_HEADSTART: ${{ vars.PACE_HEADSTART }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS }}
          ASKNEWS_MONTHLY_CALL_LIMIT: ${{ vars.ASKNEWS_MONTHLY_CALL_LIMIT }}
          QUESTION_CONCURRENCY: ${{ vars.QUESTION_CONCURRENCY }}
      - name: Save spend ledger
        if: always()
        run: bash .github/scripts/commit_state.sh
