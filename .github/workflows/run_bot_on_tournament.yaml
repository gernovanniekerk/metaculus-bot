name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Already-forecast questions are skipped.

# One group for every workflow that can spend money, so runs never overlap and
# the spend ledger is always read after the previous run committed it.
concurrency:
  group: metaculus-bot-spend
  cancel-in-progress: false

permissions:
  contents: write # to commit state/spend_ledger.json back to the repo

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # poetry.lock pins every version, so caching the virtualenv is safe.
      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --without dev
      - name: Run bot
        timeout-minutes: 45
        run: |
          poetry run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          # Optional overrides, set as repository variables (not secrets):
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          MAX_USD_PER_QUESTION: ${{ vars.MAX_USD_PER_QUESTION }}
          FULL_ENSEMBLE: ${{ vars.FULL_ENSEMBLE }}
          ECONOMY_ENSEMBLE: ${{ vars.ECONOMY_ENSEMBLE }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          PACE_HEADSTART: ${{ vars.PACE_HEADSTART }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS }}
          ASKNEWS_MONTHLY_CALL_LIMIT: ${{ vars.ASKNEWS_MONTHLY_CALL_LIMIT }}
          QUESTION_CONCURRENCY: ${{ vars.QUESTION_CONCURRENCY }}
      - name: Save spend ledger
        if: always()
        run: bash .github/scripts/commit_state.sh
